# CI: guard the JS engine + the ported Lua addon against drift and syntax errors.
# Runs the JS suite, checks the generated Lua/fixtures are in sync with their JS sources, syntax-checks
# every addon .lua (Lua 5.1 — the version WoW runs), and runs the Lua parity harnesses that assert the
# ported engine reproduces the JS goldens. (Local dev machines often have no Lua interpreter, so this is
# where the *_parity.lua checks actually run.)

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS test suite
        run: npm test

      - name: Generated Lua/fixtures are in sync with their JS sources
        run: |
          npm run gen-lua
          npm run gen-fixtures
          npm run gen-scoring-fixtures
          npm run gen-model-fixtures
          npm run gen-items-fixtures
          npm run gen-solver-fixtures
          npm run gen-optimizer-fixtures
          npm run gen-runner-fixtures
          git diff --exit-code -- \
            addon/TankadinGearSim/engine/Constants.lua \
            addon/TankadinGearSim/engine/Weights.lua \
            addon/TankadinGearSim/engine/CharacterData.lua \
            addon/TankadinGearSim/engine/ItemsData.lua \
            addon/TankadinGearSim/engine/GemsData.lua \
            addon/TankadinGearSim/engine/EnchantsData.lua \
            addon/TankadinGearSim/engine/ProfessionsData.lua \
            addon/TankadinGearSim/engine/LibramsData.lua \
            addon/TankadinGearSim/engine/ScrollsData.lua \
            addon/TankadinGearSim/engine/SetsData.lua \
            test/lua/fixtures.lua \
            test/lua/scoring_fixtures.lua \
            test/lua/model_fixtures.lua \
            test/lua/items_fixtures.lua \
            test/lua/solver_fixtures.lua \
            test/lua/optimizer_fixtures.lua \
            test/lua/runner_fixtures.lua \
          || { echo "::error::Generated files are stale — run the gen-* npm scripts and commit."; exit 1; }

      - name: Downloadable addon zip is in sync with the addon source
        # Compare the committed zip's CONTENTS (not its bytes) against the addon source — deflate output
        # isn't byte-stable across zlib/Node versions, so a byte diff would false-fail on a runner bump.
        run: |
          version="$(sed -n 's/^## *Version: *//p' addon/TankadinGearSim/TankadinGearSim.toc | tr -d '\r')"
          zip="addon/TankadinGearSim-v${version}.zip"
          # Exactly one zip, named for the .toc version — a leftover from the previous version would
          # still be served by GitHub Pages.
          found="$(ls addon/*.zip)"
          [ "$found" = "$zip" ] \
          || { echo "::error::expected exactly ${zip}, found: ${found} — run 'npm run build-addon' and commit the rename."; exit 1; }
          grep -q "addon/TankadinGearSim-v${version}.zip" index.html \
          || { echo "::error::index.html's download link doesn't point at ${zip} — run 'npm run build-addon' and commit."; exit 1; }
          tmp="$(mktemp -d)"
          unzip -q "$zip" -d "$tmp"
          diff -r --strip-trailing-cr "$tmp/TankadinGearSim" addon/TankadinGearSim \
          || { echo "::error::${zip} is out of sync with addon/TankadinGearSim/ — run 'npm run build-addon' and commit (the site serves the committed zip)."; exit 1; }

      - name: Install Lua 5.1 (WoW's Lua version)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax-check every addon Lua file
        run: find addon/TankadinGearSim -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Lua parity harnesses (engine / scoring / forward model / items / solver / optimizer / runner / async)
        run: |
          lua5.1 test/lua/eval_parity.lua
          lua5.1 test/lua/scoring_parity.lua
          lua5.1 test/lua/model_parity.lua
          lua5.1 test/lua/items_parity.lua
          lua5.1 test/lua/solver_parity.lua
          lua5.1 test/lua/optimizer_parity.lua
          lua5.1 test/lua/runner_parity.lua
          lua5.1 test/lua/async_parity.lua
