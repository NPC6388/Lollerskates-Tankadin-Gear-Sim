# CI: guard the JS engine + the ported Lua addon against drift and syntax errors.
# Runs the JS suite, checks the generated Lua/fixtures are in sync with their JS sources, syntax-checks
# every addon .lua (Lua 5.1 — the version WoW runs), and runs the Lua parity harnesses that assert the
# ported engine reproduces the JS goldens. (Local dev machines often have no Lua interpreter, so this is
# where the *_parity.lua checks actually run.)

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS test suite
        run: npm test

      - name: Generated Lua/fixtures are in sync with their JS sources
        run: |
          npm run gen-lua
          npm run gen-fixtures
          npm run gen-scoring-fixtures
          npm run gen-model-fixtures
          npm run gen-items-fixtures
          npm run gen-solver-fixtures
          git diff --exit-code -- \
            addon/TankadinGearSim/engine/Constants.lua \
            addon/TankadinGearSim/engine/Weights.lua \
            addon/TankadinGearSim/engine/CharacterData.lua \
            addon/TankadinGearSim/engine/ItemsData.lua \
            addon/TankadinGearSim/engine/GemsData.lua \
            addon/TankadinGearSim/engine/EnchantsData.lua \
            addon/TankadinGearSim/engine/ProfessionsData.lua \
            addon/TankadinGearSim/engine/LibramsData.lua \
            addon/TankadinGearSim/engine/ScrollsData.lua \
            test/lua/fixtures.lua \
            test/lua/scoring_fixtures.lua \
            test/lua/model_fixtures.lua \
            test/lua/items_fixtures.lua \
            test/lua/solver_fixtures.lua \
          || { echo "::error::Generated files are stale — run the gen-* npm scripts and commit."; exit 1; }

      - name: Install Lua 5.1 (WoW's Lua version)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax-check every addon Lua file
        run: find addon/TankadinGearSim -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Lua parity harnesses (engine / scoring / forward model / items / solver)
        run: |
          lua5.1 test/lua/eval_parity.lua
          lua5.1 test/lua/scoring_parity.lua
          lua5.1 test/lua/model_parity.lua
          lua5.1 test/lua/items_parity.lua
          lua5.1 test/lua/solver_parity.lua
